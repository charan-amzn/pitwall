[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "An F1 race-engineer data lab: Claude writes and runs analysis code in a per-session AWS Lambda MicroVM over open F1 data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
# Host (CLI) deps only. The coding agent (Claude Code) and analysis libraries
# (pandas/matplotlib) run INSIDE the MicroVM — the host process is a thin proxy
# that just launches the VM and streams events back, so it needs no LLM SDK.
# Install pandas/matplotlib via the `synthetic` extra only if you build the
# offline dataset locally.
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# For building/inspecting the dataset locally (the synthetic generator and
# any local pandas poking). Not needed for the normal MicroVM run path.
synthetic = ["pandas>=2.0", "matplotlib>=3.7"]
# For the pit-wall web UI (pitwall-web).
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
pitwall = "pitwall.cli:main"
pitwall-web = "pitwall.web:main"

[tool.setuptools.packages.find]
include = ["pitwall*"]

[tool.setuptools.package-data]
pitwall = ["static/*"]
